
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10152d">
<title>Color Sort 3D Premium</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;background:radial-gradient(ellipse at top,#344e87,#11172e 70%);
 font-family:Arial,sans-serif;color:white;min-height:100vh
}
.game{
 max-width:520px;margin:auto;padding:20px 14px;min-height:100vh;
 display:flex;flex-direction:column;align-items:center
}
h1{
 font-size:32px;margin:12px 0 4px;font-weight:1000;letter-spacing:1px;
 background:linear-gradient(90deg,#52f4dd,#fff0a1,#8cb8ff);
 background-clip:text;-webkit-background-clip:text;color:transparent;text-align:center
}
.subtitle{color:#b9c9ed;margin-bottom:18px;font-size:13px;text-align:center}
.stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{
 background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;
 padding:12px;text-align:center;color:#aebfe3;font-size:11px
}
.stat strong{display:block;color:white;font-size:21px;margin-top:5px}
.coins{color:#ffe27a}
.progress{width:100%;height:7px;background:#ffffff20;border-radius:10px;margin:17px 0 8px;overflow:hidden}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#36e4d1,#ffdc75);transition:width .3s}
.levelText{font-size:12px;color:#c5d5f4;margin-bottom:15px}
#board{
 width:100%;min-height:310px;display:flex;flex-wrap:wrap;
 justify-content:center;align-content:center;gap:25px 15px;padding:15px 0
}
.tube{
 width:57px;height:176px;border:3px solid #d5e9ff99;border-top:0;
 border-radius:0 0 23px 23px;position:relative;display:flex;
 flex-direction:column-reverse;align-items:center;justify-content:flex-start;
 padding:5px 4px 7px;
 background:linear-gradient(90deg,#ffffff22,#ffffff05 40%,#ffffff25);
 box-shadow:inset 4px 0 8px #ffffff18,inset -4px 0 8px #ffffff15,0 13px 22px #0005;
 cursor:pointer;transition:transform .2s,border-color .2s
}
.tube:before{
 content:"";position:absolute;top:-3px;left:-3px;width:calc(100% + 6px);
 height:5px;border:2px solid #d5e9ff99;border-radius:50%;background:#c9e6ff20
}
.tube.selected{
 transform:translateY(-15px);border-color:#ffe27a;
 filter:drop-shadow(0 0 9px #ffe27a88)
}
.ball{
 width:42px;height:35px;flex-shrink:0;border-radius:50%;margin-top:-1px;
 position:relative;box-shadow:inset -6px -6px 9px #0005,
 inset 5px 5px 9px #ffffff88,0 2px 5px #0005;
 animation:appear .18s ease-out
}
.ball:after{
 content:"";position:absolute;top:5px;left:8px;width:12px;height:6px;
 border-radius:50%;background:#ffffff80;filter:blur(1px)
}
@keyframes appear{from{transform:scale(.7)}to{transform:scale(1)}}
.controls,.shop{
 display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px
}
button{
 border:0;border-radius:13px;padding:13px 16px;font-weight:bold;
 font-size:13px;color:#15203b;
 background:linear-gradient(135deg,#62e8db,#9cbaff);
 box-shadow:0 5px 14px #0004;cursor:pointer
}
button:active{transform:scale(.95)}
button.secondary{background:linear-gradient(135deg,#ffe38a,#ffb95e)}
button.sound-on{background:linear-gradient(135deg,#75f0b0,#42c9a0)}
button.sound-off{background:linear-gradient(135deg,#ffc4c4,#ff8585)}
.message{
 min-height:35px;text-align:center;color:#ffe27a;font-weight:bold;
 margin-top:18px;font-size:14px
}
.ad{
 margin-top:auto;margin-top:25px;min-height:65px;width:100%;
 border:1px dashed #ffffff35;border-radius:12px;display:flex;
 align-items:center;justify-content:center;color:#8495ba;font-size:11px
}
.modal{
 position:fixed;inset:0;background:#080e20dd;display:none;
 align-items:center;justify-content:center;padding:20px;z-index:10
}
.modal.show{display:flex}
.modalBox{
 background:linear-gradient(145deg,#293e6e,#131d3a);
 border:1px solid #ffffff35;border-radius:24px;padding:28px 20px;
 text-align:center;width:100%;max-width:340px;box-shadow:0 20px 60px #0009
}
.modalBox h2{color:#ffe27a}
.modalBox p{color:#c6d5f0;line-height:1.6}
@media(max-width:360px){
 .tube{width:49px;height:158px}
 .ball{width:36px;height:30px}
 .game{padding-left:9px;padding-right:9px}
}
</style>
</head>

<body>
<div class="game">

<h1>COLOR SORT 3D</h1>
<div class="subtitle">THE PREMIUM PUZZLE EXPERIENCE</div>

<div class="stats">
 <div class="stat">NIVEAU<strong id="level">1</strong></div>
 <div class="stat">COUPS<strong id="moves">0</strong></div>
 <div class="stat coins">🪙 PIÈCES<strong id="coins">0</strong></div>
</div>

<div class="progress"><div id="progressBar"></div></div>
<div class="levelText" id="levelText">Progression du niveau</div>

<div id="board"></div>

<div class="controls">
 <button onclick="undo()">↶ ANNULER</button>
 <button onclick="restart()">↻ REJOUER</button>
 <button class="secondary" onclick="nextLevel()">NIVEAU SUIVANT ➜</button>
</div>

<div class="shop">
 <button onclick="addTube()">🧪 +1 TUBE (50 🪙)</button>
 <button onclick="toggleSound()" id="soundBtn" class="sound-off">🔊 ACTIVER LE SON</button>
</div>

<div class="message" id="message">Choisis un tube pour commencer !</div>
<div class="ad">EMPLACEMENT PUBLICITAIRE</div>
</div>

<div class="modal" id="winModal">
 <div class="modalBox">
  <div style="font-size:55px">🏆</div>
  <h2>NIVEAU TERMINÉ !</h2>
  <p>Excellent travail ! Tu as gagné <strong>20 pièces</strong> !</p>
  <button onclick="closeWin()">CONTINUER ➜</button>
 </div>
</div>

<script>
"use strict";

/* -----------------------------
   CONFIGURATION DU JEU
----------------------------- */

const COLORS=[
 "#ff4669","#35c5ff","#ffd23f","#aa7bff","#36dfa0",
 "#ff8b38","#f36bc7","#b1ed45","#43e0d9","#ffbd91"
];

const CAPACITY=4;
const $=id=>document.getElementById(id);

let level=Math.max(1,Number(localStorage.getItem("cs_level"))||1);
let coins=Number(localStorage.getItem("cs_coins"))||0;

let tubes=[];
let initial=[];
let selected=null;
let moves=0;
let history=[];
let completed=false;
let extraTubes=0;

/* -----------------------------
   SYSTEME AUDIO PROFESSIONNEL
----------------------------- */

let soundEnabled=false;
let audioContext=null;
let musicTimer=null;
let musicGain=null;
let effectsGain=null;

const melody=[
 523.25,659.25,783.99,659.25,
 587.33,698.46,880.00,698.46,
 523.25,659.25,783.99,1046.50,
 880.00,783.99,659.25,587.33
];

function initAudio(){
 const AudioClass=window.AudioContext||window.webkitAudioContext;

 if(!AudioClass)return false;

 if(!audioContext){
  audioContext=new AudioClass();

  musicGain=audioContext.createGain();
  musicGain.gain.value=0.55;
  musicGain.connect(audioContext.destination);

  effectsGain=audioContext.createGain();
  effectsGain.gain.value=0.8;
  effectsGain.connect(audioContext.destination);
 }

 if(audioContext.state==="suspended"){
  audioContext.resume();
 }

 return true;
}

function playNote(frequency,start,duration,volume,type="sine"){
 if(!audioContext||!musicGain)return;

 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();

 osc.type=type;
 osc.frequency.setValueAtTime(frequency,start);

 gain.gain.setValueAtTime(0.001,start);
 gain.gain.linearRampToValueAtTime(volume,start+0.035);
 gain.gain.exponentialRampToValueAtTime(0.001,start+duration);

 osc.connect(gain);
 gain.connect(musicGain);

 osc.start(start);
 osc.stop(start+duration+0.03);
}

function playMusicPhrase(){
 if(!soundEnabled||!audioContext)return;

 const now=audioContext.currentTime+0.08;

 melody.forEach((note,index)=>{
  const time=now+index*0.24;

  // Mélodie principale
  playNote(note,time,0.28,0.045,"sine");

  // Accompagnement doux
  if(index%4===0){
   playNote(note/2,time,0.65,0.018,"triangle");
  }
 });
}

function startMusic(){
 if(!soundEnabled||!initAudio())return;

 stopMusic();

 playMusicPhrase();

 // Nouvelle phrase musicale toutes les 3,9 secondes
 musicTimer=setInterval(()=>{
  if(soundEnabled)playMusicPhrase();
 },3900);
}

function stopMusic(){
 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
 }
}

function activateSound(){
 soundEnabled=true;

 if(!initAudio()){
  $("message").textContent="Audio non disponible sur cet appareil.";
  soundEnabled=false;
  updateSoundButton();
  return;
 }

 updateSoundButton();
 startMusic();
 playEffect(660,0.12,0.07);
}

function toggleSound(){
 if(soundEnabled){
  soundEnabled=false;
  stopMusic();

  if(musicGain&&audioContext){
   musicGain.gain.setTargetAtTime(
    0,audioContext.currentTime,0.08
   );
  }

  updateSoundButton();
 }else{
  activateSound();

  if(musicGain&&audioContext){
   musicGain.gain.setTargetAtTime(
    0.55,audioContext.currentTime,0.15
   );
  }
 }
}

function updateSoundButton(){
 const btn=$("soundBtn");

 if(soundEnabled){
  btn.textContent="🔊 SON ACTIVÉ";
  btn.className="sound-on";
 }else{
  btn.textContent="🔇 SON DÉSACTIVÉ";
  btn.className="sound-off";
 }
}

function playEffect(frequency,duration=0.12,volume=0.07,type="sine"){
 if(!soundEnabled||!audioContext||!effectsGain)return;

 const now=audioContext.currentTime;
 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();

 osc.type=type;
 osc.frequency.setValueAtTime(frequency,now);

 gain.gain.setValueAtTime(0.001,now);
 gain.gain.linearRampToValueAtTime(volume,now+0.015);
 gain.gain.exponentialRampToValueAtTime(0.001,now+duration);

 osc.connect(gain);
 gain.connect(effectsGain);

 osc.start(now);
 osc.stop(now+duration+0.03);
}

function soundSelect(){
 playEffect(520,0.10,0.06);
}

function soundMove(){
 playEffect(720,0.14,0.075);
}

function soundError(){
 playEffect(190,0.16,0.055,"triangle");
}

function soundUndo(){
 playEffect(380,0.14,0.06);
}

function soundVictory(){
 if(!soundEnabled)return;

 const notes=[523.25,659.25,783.99,1046.50];

 notes.forEach((note,index)=>{
  setTimeout(()=>{
   if(soundEnabled)playEffect(note,0.35,0.10);
  },index*180);
 });
}

/* -----------------------------
   LOGIQUE DU JEU
----------------------------- */

function copy(array){
 return array.map(tube=>[...tube]);
}

function solved(state){
 return state.every(tube=>
  !tube.length||
  (tube.length===CAPACITY&&tube.every(c=>c===tube[0]))
 );
}

function generate(){
 const colorCount=Math.min(
  3+Math.floor((level-1)/2),
  COLORS.length
 );

 const puzzle=[];

 for(let i=0;i<colorCount;i++){
  puzzle.push([i,i,i,i]);
 }

 puzzle.push([],[]);

 let last=null;
 const shuffleSteps=Math.min(260,70+level*18);

 for(let k=0;k<shuffleSteps;k++){
  const choices=[];

  for(let from=0;from<puzzle.length;from++){
   if(!puzzle[from].length)continue;

   for(let to=0;to<puzzle.length;to++){
    if(from===to||puzzle[to].length>=CAPACITY)continue;

    const color=puzzle[from][puzzle[from].length-1];

    if(puzzle[to].length&&
       puzzle[to][puzzle[to].length-1]!==color){
     continue;
    }

    if(last&&last.from===to&&last.to===from)continue;

    choices.push({from,to});
   }
  }

  if(!choices.length)break;

  const move=choices[Math.floor(Math.random()*choices.length)];

  puzzle[move.to].push(puzzle[move.from].pop());
  last=move;
 }

 return puzzle;
}

function start(){
 tubes=generate();

 for(let i=0;i<extraTubes;i++){
  tubes.push([]);
 }

 initial=copy(tubes);
 selected=null;
 moves=0;
 history=[];
 completed=false;

 $("winModal").classList.remove("show");
 $("message").textContent="Choisis un tube pour commencer !";

 update();
}

function update(){
 $("level").textContent=level;
 $("moves").textContent=moves;
 $("coins").textContent=coins;

 const progress=Math.min(100,(moves/Math.max(1,level*8))*100);
 $("progressBar").style.width=progress+"%";
 $("levelText").textContent="NIVEAU "+level;

 const board=$("board");
 board.innerHTML="";

 tubes.forEach((tube,index)=>{
  const element=document.createElement("div");

  element.className="tube"+(selected===index?" selected":"");

  tube.forEach(color=>{
   const ball=document.createElement("div");
   ball.className="ball";
   ball.style.background=COLORS[color];
   element.appendChild(ball);
  });

  element.addEventListener("click",()=>clickTube(index));

  board.appendChild(element);
 });
}

function clickTube(index){
 if(completed)return;

 // Le premier toucher autorise le son sur iPhone et Android.
 if(!soundEnabled){
  activateSound();
 }

 if(selected===null){
  if(!tubes[index].length)return;

  selected=index;
  soundSelect();
  update();
  return;
 }

 if(selected===index){
  selected=null;
  update();
  return;
 }

 const from=tubes[selected];
 const to=tubes[index];

 if(from.length&&to.length<CAPACITY){
  const color=from[from.length-1];

  if(!to.length||to[to.length-1]===color){
   history.push(copy(tubes));

   to.push(from.pop());
   moves++;

   soundMove();
  }else{
   soundError();
   $("message").textContent="Tu ne peux pas mélanger ces couleurs !";
  }
 }

 selected=null;
 update();
 checkWin();
}

function checkWin(){
 if(!solved(tubes))return;

 completed=true;
 coins+=20;

 localStorage.setItem("cs_coins",coins);
 localStorage.setItem("cs_level",level+1);

 $("message").textContent="🎉 BRAVO ! +20 PIÈCES";

 soundVictory();

 $("winModal").classList.add("show");
 update();
}

function closeWin(){
 $("winModal").classList.remove("show");

 level++;
 localStorage.setItem("cs_level",level);

 start();
}

function undo(){
 if(completed||!history.length)return;

 tubes=history.pop();
 moves=Math.max(0,moves-1);
 selected=null;

 soundUndo();
 update();
}

function restart(){
 if(completed)return;

 tubes=copy(initial);
 moves=0;
 history=[];
 selected=null;

 update();
 $("message").textContent="Niveau recommencé !";

 playEffect(420,0.12,0.05);
}

function nextLevel(){
 if(completed)return;

 level++;
 localStorage.setItem("cs_level",level);

 start();

 $("message").textContent="⭐ Nouveau défi !";
 playEffect(700,0.16,0.06);
}

function addTube(){
 if(completed)return;

 if(coins<50){
  $("message").textContent="Il te faut 50 pièces pour acheter un tube.";
  soundError();
  return;
 }

 coins-=50;
 extraTubes++;

 localStorage.setItem("cs_coins",coins);

 tubes.push([]);
 initial=copy(tubes);

 update();

 $("message").textContent="🧪 Nouveau tube ajouté !";
 playEffect(850,0.16,0.07);
}

/* -----------------------------
   DEMARRAGE
----------------------------- */

updateSoundButton();
start();

</script>
</body>
</html>
