
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10152d">
<title>Color Sort 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #293d72, #10152d 70%);
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.game {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  padding: 25px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: 34px;
  margin: 15px 0 5px;
  font-weight: 900;
  background: linear-gradient(90deg, #40e0d0, #ffdb70);
  color: transparent;
  background-clip: text;
}

.subtitle {
  color: #b9c9ed;
  margin-bottom: 20px;
}

.stats {
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #ffffff12;
  border: 1px solid #ffffff20;
  padding: 14px;
  border-radius: 16px;
  margin-bottom: 25px;
}

.stat {
  text-align: center;
  font-size: 13px;
  color: #b9c9ed;
}

.stat strong {
  display: block;
  font-size: 21px;
  color: white;
  margin-top: 5px;
}

#board {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 22px 15px;
  padding: 15px 0;
  min-height: 300px;
}

.tube {
  width: 55px;
  height: 170px;
  border: 3px solid #d5e5ff99;
  border-top: 0;
  border-radius: 0 0 23px 23px;
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  justify-content: flex-start;
  padding: 5px 4px 7px;
  cursor: pointer;
  position: relative;
  background: linear-gradient(90deg, #ffffff12, #ffffff05, #ffffff20);
  box-shadow: inset 0 -8px 15px #ffffff12,
              0 12px 20px #0005;
  transition: transform .2s, border-color .2s;
}

.tube.selected {
  transform: translateY(-13px);
  border-color: #ffe66d;
}

.ball {
  width: 40px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 50%;
  margin-top: -1px;
  box-shadow: inset -5px -5px 8px #0003,
              inset 4px 4px 8px #ffffff66,
              0 2px 4px #0004;
}

.controls {
  display: flex;
  gap: 12px;
  margin-top: 25px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  border: 0;
  padding: 14px 21px;
  border-radius: 13px;
  font-size: 15px;
  font-weight: bold;
  color: #14203b;
  background: linear-gradient(135deg, #62e8db, #8bafff);
  cursor: pointer;
  box-shadow: 0 5px 15px #0004;
}

button:active {
  transform: scale(.96);
}

.message {
  margin-top: 20px;
  min-height: 28px;
  color: #ffe66d;
  text-align: center;
  font-weight: bold;
}

.ad-space {
  margin-top: auto;
  min-height: 70px;
  width: 100%;
  border: 1px dashed #ffffff35;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8394ba;
  font-size: 12px;
  margin-top: 35px;
}

@media(max-width: 360px) {
  .tube {
    width: 48px;
    height: 155px;
  }
  .ball {
    width: 34px;
    height: 30px;
  }
}
</style>
</head>

<body>
<div class="game">
  <h1>COLOR SORT 3D</h1>
  <div class="subtitle">Trie les couleurs pour gagner !</div>

  <div class="stats">
    <div class="stat">NIVEAU<strong id="level">1</strong></div>
    <div class="stat">COUPS<strong id="moves">0</strong></div>
    <div class="stat">RECORD<strong id="record">1</strong></div>
  </div>

  <div id="board"></div>

  <div class="controls">
    <button onclick="undo()">↶ Annuler</button>
    <button onclick="restart()">↻ Recommencer</button>
    <button onclick="newGame()">Nouveau niveau</button>
  </div>

  <div class="message" id="message">Choisis un tube pour commencer.</div>

  <div class="ad-space">
    Espace réservé à la publicité
  </div>
</div>

<script>
const colors = [
  "#ff4d6d", "#38bdf8", "#facc15",
  "#a78bfa", "#34d399", "#fb923c",
  "#f472b6", "#a3e635"
];

const CAPACITY = 4;
let tubes = [];
let selected = null;
let moves = 0;
let level = 1;
let history = [];

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function newGame() {
  const count = Math.min(3 + level, colors.length);
  const balls = [];

  for (let i = 0; i < count; i++) {
    for (let j = 0; j < CAPACITY; j++) {
      balls.push(i);
    }
  }

  shuffle(balls);

  tubes = [];
  for (let i = 0; i < count; i++) {
    tubes.push(balls.slice(i * CAPACITY, (i + 1) * CAPACITY));
  }

  tubes.push([]);
  tubes.push([]);

  moves = 0;
  selected = null;
  history = [];
  update();
}

function update() {
  document.getElementById("level").textContent = level;
  document.getElementById("moves").textContent = moves;
  document.getElementById("record").textContent =
    localStorage.getItem("colorSortRecord") || 1;

  const board = document.getElementById("board");
  board.innerHTML = "";

  tubes.forEach((tube, index) => {
    const element = document.createElement("div");
    element.className = "tube" +
      (selected === index ? " selected" : "");

    tube.forEach(color => {
      const ball = document.createElement("div");
      ball.className = "ball";
      ball.style.background = colors[color];
      element.appendChild(ball);
    });

    element.onclick = () => clickTube(index);
    board.appendChild(element);
  });
}

function clickTube(index) {
  document.getElementById("message").textContent = "";

  if (selected === null) {
    if (tubes[index].length === 0) return;
    selected = index;
    update();
    return;
  }

  if (selected === index) {
    selected = null;
    update();
    return;
  }

  const from = tubes[selected];
  const to = tubes[index];

  if (from.length > 0 && to.length < CAPACITY) {
    const color = from[from.length - 1];

    if (to.length === 0 || to[to.length - 1] === color) {
      history.push(JSON.stringify(tubes));
      to.push(from.pop());
      moves++;
    }
  }

  selected = null;
  update();
  checkWin();
}

function checkWin() {
  const won = tubes.every(tube =>
    tube.length === 0 ||
    (tube.length === CAPACITY &&
     tube.every(color => color === tube[0]))
  );

  if (won) {
    document.getElementById("message").textContent =
      "🎉 Bravo ! Niveau terminé !";

    const record = Math.max(
      level,
      Number(localStorage.getItem("colorSortRecord") || 1)
    );

    localStorage.setItem("colorSortRecord", record);

    setTimeout(() => {
      level++;
      newGame();
      document.getElementById("message").textContent =
        "⭐ Niveau suivant !";
    }, 1400);
  }
}

function undo() {
  if (history.length === 0) return;

  tubes = JSON.parse(history.pop());
  moves = Math.max(0, moves - 1);
  selected = null;
  update();
}

function restart() {
  if (history.length > 0) {
    tubes = JSON.parse(history[0]);
    moves = 0;
    history = [];
    selected = null;
    update();
  } else {
    newGame();
  }
}

newGame();
</script>
</body>
</html>
